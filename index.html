}

/* ---------- live wedstrijd ---------- */
let LIVE=null;
function liveAan(){return !S.dl&&!S.fired&&!LIVE&&!S.welkom&&!S.startscherm;}
function liveMogelijk(){
  if(!liveAan()||S.round>=ROUNDS||S.preseason) return false;
  if(breakDue()) return false;
  return !!mijnDuelNu();
}
function mijnDuelNu(){
  /* geeft {soort,h,a} voor het eerstvolgende duel van jouw club in deze ronde */
  if(cupDue()){
    const cup=myCup();
    if(!cup||cup.winner!=null||cup.alive.indexOf(S.myClub)<0) return null;
    const P=cupPairing(cup);
    return P.ties.some(t=>t[0]===S.myClub||t[1]===S.myClub)?{soort:"beker"}:null;
  }
  if(euroDue()){
    const k=S.clubs[S.myClub].euro;
    if(!k||!S.euro[k]) return null;
    const E=S.euro[k], md=EURO_ROUNDS[S.round];
    if(md<8){
      const f=(E.fixtures[md]||[]).find(x=>x.h===S.myClub||x.a===S.myClub);
      return f?{soort:"europa",h:f.h,a:f.a}:null;
    }
    return E.alive&&E.alive.indexOf(S.myClub)>=0?{soort:"europa"}:null;
  }
  const L=S.leagues[myLeague()];
  if(S.round>=L.fixtures.length) return null;
  const f=L.fixtures[S.round].find(x=>x.h===S.myClub||x.a===S.myClub);
  return f?{soort:"competitie",h:f.h,a:f.a}:null;
}
function startLive(){
  if(LIVE) return;
  const duel=mijnDuelNu();
  if(!duel) return;
  if(duel.soort!=="competitie"){
    /* beker en Europa: eerst het toernooi laten loten, daarna jouw duel live */
    const vooraf=duel.soort==="beker"?playCupLive():playEuroLive();
    if(!vooraf){ if(duel.soort==="beker")playCup(); else playEuroRound();
      tab=duel.soort==="beker"?"beker":"europa"; syncTabs(); render();
      toast("Je club was deze ronde vrijgeloot — de rest is gesimuleerd."); return; }
    return;
  }
  const L=S.leagues[myLeague()];
  const f=L.fixtures[S.round].find(x=>x.h===S.myClub||x.a===S.myClub);
  LIVE={M:liveStart(f.h,f.a,{lg:leagueAvg()}),minuut:0,fase:"h1",soort:"competitie",getoond:[],tip:false};
  tab="live"; syncTabs(); render(); tickLive();
}
/* beker- en Europaduels live: de rest van de ronde wordt na afloop gespeeld */
function playCupLive(){
  const cup=myCup(); if(!cup) return false;
  const paren=cupPairing(cup);
  const mijn=paren.ties.find(t=>t[0]===S.myClub||t[1]===S.myClub);
  if(!mijn) return false;
  LIVE={M:liveStart(mijn[0],mijn[1],{lg:leagueAvg(),cup:true,ctx:"cup",neutral:cup.alive.length===2}),
    minuut:0,fase:"h1",soort:"beker",paren,getoond:[],tip:false};
  tab="live"; syncTabs(); render(); tickLive(); return true;
}
function playEuroLive(){
  const k=S.clubs[S.myClub].euro, E=S.euro[k], md=EURO_ROUNDS[S.round];
  const paren=euroPairing(k,md);
  const mijn=paren.ties.find(t=>t[0]===S.myClub||t[1]===S.myClub);
  if(!mijn) return false;
  LIVE={M:liveStart(mijn[0],mijn[1],{lg:leagueAvg(),ctx:"eu",cup:md>=8,neutral:md===12}),
    minuut:0,fase:"h1",soort:"europa",paren,comp:k,md,getoond:[],tip:false};
  tab="live"; syncTabs(); render(); tickLive(); return true;
}
function tickLive(){
  if(!LIVE) return;
  clearInterval(LIVE.timer);
  const grens=LIVE.fase==="h1"?45:90;
  const tempo=(S.instellingen&&S.instellingen.tempo)||70;
  LIVE.timer=setInterval(()=>{
    if(!LIVE){return;}
    LIVE.minuut+=1;
    if(LIVE.fase==="h2"&&!LIVE.tip&&LIVE.minuut>=62){
      const v=wisselTip();
      if(v){LIVE.tip=true;LIVE.tipTekst=v;clearInterval(LIVE.timer);LIVE.fase="tip";tekenLive();return;}
    }
    if(LIVE.minuut>=grens){
      LIVE.minuut=grens;
      clearInterval(LIVE.timer);
      LIVE.fase=LIVE.fase==="h1"?"rust":"einde";
    }
    tekenLive();
  },tempo);
}
function mijnTeam(){return LIVE.M.H.cid===S.myClub?LIVE.M.H:LIVE.M.A;}
function wisselKandidaten(){
  const T=mijnTeam();
  const uit=T.xi.filter(Boolean).filter(p=>p.pos!=="GK")
    .map(p=>({p,score:(100-p.cond)+(T.ratings[p.id]?(6.5-(T.ratings[p.id].g?7.6:6.4))*10:0)}))
    .sort((a,b)=>b.score-a.score).map(x=>x.p);
  const bank=squad(S.myClub).filter(p=>available(p)&&!T.xi.some(x=>x&&x.id===p.id))
    .sort((a,b)=>(b.ovr+b.cond*.12)-(a.ovr+a.cond*.12));
  return {uit,bank};
}
function wisselTip(){
  const T=mijnTeam();
  if(T.subs>=3) return null;
  const moe=T.xi.filter(Boolean).filter(p=>p.pos!=="GK"&&p.cond<58).sort((a,b)=>a.cond-b.cond)[0];
  if(!moe) return null;
  const bank=squad(S.myClub).filter(p=>available(p)&&p.pos!=="GK"&&p.cond>78&&!T.xi.some(x=>x&&x.id===p.id));
  if(!bank.length) return null;
  const slotIx=T.xi.findIndex(p=>p&&p.id===moe.id);
  const slot=T.slots[slotIx]?T.slots[slotIx][0]:"CM";
  bank.sort((a,b)=>slotFit(b,slot)-slotFit(a,slot));
  return {uit:moe,in:bank[0],slot};
}
function liveScore(){
  const M=LIVE.M, tot=LIVE.minuut;
  let h=0,a=0;
  M.timeline.filter(t=>t.type==="goal"&&t.min<=tot).forEach(t=>{ if(t.c===M.hid)h++; else a++; });
  return [h,a];
}
function tekenLive(){ view.innerHTML=vLive(); bind(); }

  const klok=LIVE.fase==="rust"?"RUST":LIVE.fase==="einde"?"EINDE":LIVE.minuut+"'";
  const kand=wisselKandidaten(), mijnT=mijnTeam();
  const rust=LIVE.fase==="rust"?`<div class="card"><div class="card-h"><span>🎙️ Rust</span><span>je mag ingrijpen</span></div>
    <div class="lbl">Instelling</div>

    <div class="lbl">Pressing</div>

    <div class="lbl">Wissels (${mijnT.subs}/3) — bovenaan staan de spelers die het meest toe zijn aan rust</div>
    <div class="field" style="padding-top:6px">
      <select id="liveUit">${kand.uit.map(p=>`<option value="${p.id}">${esc(p.name)} · ${p.pos} · ${p.cond}% fit</option>`).join("")}</select>
      <select id="liveIn" style="margin-top:8px">${kand.bank.slice(0,14).map(p=>`<option value="${p.id}">${esc(p.name)} · ${p.pos} · ${p.ovr} · ${p.cond}%</option>`).join("")}</select>
      <button class="btn" id="liveWissel" style="margin-top:8px">🔁 Wisselen</button></div>
    <div class="field"><button class="btn primary" id="liveVerder" style="width:100%">Tweede helft ⚽</button></div></div>`:"";
  const einde=LIVE.fase==="einde"?`<div class="field"><button class="btn primary" id="liveKlaar" style="width:100%">Verder ▶</button></div>`:"";
  const tip=LIVE.fase==="tip"&&LIVE.tipTekst?`<div class="card" style="border-color:var(--accent)">
      <div class="card-h" style="color:var(--accent)"><span>🔁 Wisselvoorstel</span><span>${LIVE.minuut}'</span></div>
      <p class="hint"><b>${esc(LIVE.tipTekst.uit.name)}</b> is op (${LIVE.tipTekst.uit.cond}% fit).
        Je assistent stelt <b>${esc(LIVE.tipTekst.in.name)}</b> voor op ${LIVE.tipTekst.slot}.</p>
      <div class="field"><button class="btn primary" id="tipJa">Wissel doorvoeren</button>
        <button class="btn" id="tipNee">Laten staan</button></div></div>`:"";
  return `<div class="card live"><div class="livekop">
      <div class="lteam"><span class="mini-crest big" style="background:${thuis.color}">${esc(initials(thuis.name))}</span>
        <b>${esc(thuis.name)}</b></div>
      <div class="lscore"><span class="num">${h} – ${a}</span><span class="lklok">${klok}</span></div>
      <div class="lteam"><span class="mini-crest big" style="background:${uit.color}">${esc(initials(uit.name))}</span>
        <b>${esc(uit.name)}</b></div></div>
    <div class="lbalk"><i style="width:${Math.min(100,LIVE.minuut/90*100)}%"></i></div>
    <div class="timeline">${gebeurtenissen.length?gebeurtenissen.map(t=>`<div class="tl ${t.c===S.myClub?"own":""}">
      <span class="min num">${t.min}'</span><span class="ic">${icon[t.type]||"•"}</span>
      <span class="tx">${esc(t.n)}${t.as?` <span class="dim">assist ${esc(t.as)}</span>`:""}${t.type==="sub"?` <span class="dim">voor ${esc(t.out)}</span>`:""}
      <i class="dot" style="background:${col(t.c)}"></i></span></div>`).join(""):'<p class="hint">Nog niets gebeurd.</p>'}</div>
    ${einde}</div>${tip}${rust}`;
}
function liveAfronden(){
  const res=liveSecond(LIVE.M);
  const soort=LIVE.soort, paren=LIVE.paren, comp=LIVE.comp, md=LIVE.md;
  LIVE=null;
  if(soort==="beker"){ playCup(res,paren); tab="beker"; }
  else if(soort==="europa"){ playEuroRound(res,paren,comp,md); tab="europa"; }
  else { simRound(res); if(windowOpen()) aiWindow(6); tab="programma"; }
  syncTabs(); render();
}

function openMsg(mid){
  const m=S.inbox.find(x=>x.id===mid); if(!m) return;
  m.read=true; save();
  const acts=(m.acties||[]).map(a=>`<button class="btn ${a.id==="negeer"||a.id==="walk"||a.id==="rejectBid"?"ghost":"primary"}" data-msgact="${a.id}">${esc(a.label)}</button>`).join("");

    ${m.resultaat?`<p class="hint" style="padding:0">${esc(m.resultaat)}</p>`:""}
    ${acts?`<div class="acts">${acts}</div>`:""}`);

function doAction(act,id){
  const p=byId(id);
  if(act==="bid"){closeSheet();openBid(id);return;}
  if(act==="short"){if(S.shortlist.indexOf(id)<0)S.shortlist.push(id);save();closeSheet();render();toast("Op de shortlist gezet.");return;}
  if(act==="clause"){
    const r=makeBid(id,p.clause,wageDemand(p),"Belangrijk");
    closeSheet();render();toast(r.err||r.info||r.ok||"");return;
  }
  if(act==="list"){const e2=listPlayer(id);toast(e2||`${p.name} staat te koop. Clubs melden zich in je inbox.`);closeSheet();render();return;}
  if(act==="unlist"){unlist(id);toast(`${p.name} is van de lijst gehaald.`);closeSheet();render();return;}
  if(act==="loanout"){const e=loanOut(id);toast(e||`${p.name} is verhuurd.`);closeSheet();render();return;}
  if(act==="loanin"){const e=loanIn(id);toast(e||`${p.name} komt op huurbasis.`);closeSheet();render();return;}
  if(act==="release"){
    closeSheet();
    ask("Speler ontslaan?",`${p.name} verlaat de club zonder vergoeding.`,"Ontslaan",()=>{
      const e=release(id); render(); toast(e||`${p.name} is ontslagen.`);
    });
    return;
  }
  let err=null,msgTxt=null;
  if(act==="renew"){err=renew(id);msgTxt="Contract verlengd.";}
  if(act==="sell"){const r=sell(id);if(typeof r==="string")err=r;else msgTxt=r.ok;}
  toast(err||msgTxt); closeSheet(); render();
}
let toonAlleSpelers=false;
function openSlotPicker(i){
  const slot=FORMATIONS[S.tactics.formation][i][0], cur=S.lineup[i];
  const alles=squad(S.myClub).filter(available);
  const passend=alles.filter(p=>fam(p,slot)>=.9||p.poss.indexOf(slot)>=0);
  const cand=(toonAlleSpelers?alles:(passend.length>=3?passend:alles))
    .sort((a,b)=>slotFit(b,slot)-slotFit(a,slot)).slice(0,26);
  const rows=cand.map(p=>{
    const f=fam(p,slot), lbl=f===1?"natuurlijke positie":f>=.9?"kan hier uit de voeten":"staat uit positie";
    return `<button class="p" data-pick="${p.id}"><span class="badge" style="background:${tier(p.ovr)}">${p.ovr}</span>
      <span><span class="nm">${p.id===cur?'<i class="xi"></i>':""}${esc(p.name)}</span>
      <span class="meta">${p.poss.join("/")} · ${lbl} · fit ${p.cond}% · ${formTxt(p.form)}</span></span>
      <span class="st">${S.lineup.indexOf(p.id)>=0&&p.id!==cur?"in elftal":""}</span></button>`;
  }).join("");
  openSheet(`<h3>${slot}</h3><div class="sub">${toonAlleSpelers?"Alle beschikbare spelers":"Spelers die op deze positie uit de voeten kunnen"} — een basisspeler kiezen ruilt de plekken om.</div>
    <div class="field" style="padding:0 0 10px"><button class="mini-btn" id="alleSpelers">${toonAlleSpelers?"toon alleen passende spelers":"toon de hele selectie"}</button></div>${rows}`);
  const as2=document.getElementById("alleSpelers");
  if(as2) as2.onclick=()=>{toonAlleSpelers=!toonAlleSpelers;closeSheet();openSlotPicker(i);};
  sheet.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{
    const pid=+b.dataset.pick, j=S.lineup.indexOf(pid);
    if(j>=0) S.lineup[j]=S.lineup[i];
    S.lineup[i]=pid; save(); closeSheet(); render();
  });
}

    r.readAsText(f);};
  const br=document.getElementById("btnReset");
  if(br) br.onclick=()=>ask("Nieuwe carrière starten?","Je huidige voortgang verdwijnt tenzij je hem in een slot hebt bewaard.","Nieuwe carrière",()=>{
    S.welkom=true; S.startscherm=false; startLiga=null; startClub=null; render();
  });
}
function syncTabs(){sectie=sectieVan(tab);}
document.getElementById("tabs").onclick=e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.sect){sectie=b.dataset.sect;tab=SECTIES[sectie].tabs[0][0];render();return;}
  if(b.dataset.tab){tab=b.dataset.tab;render();}
};
document.getElementById("btnNext").onclick=()=>{
  if(S.dl){endDeadline();render();toast("De transfermarkt is gesloten.");return;}
  if(S.preseason){const m=playFriendly();tab="programma";syncTabs();render();
    toast("Oefenwedstrijd: "+m.hg+"-"+m.ag);return;}
  if(deadlineNodig()){startDeadline();tab="transfers";syncTabs();render();
    toast("Deadline day! De markt sluit vanavond.");return;}
  if(S.round>=ROUNDS){
    const c=table(myLeague())[0].name; endSeason(); tab="stand"; syncTabs(); render();
    toast("Kampioen: "+c+". Nieuw seizoen gestart."); return;
  }
  if(breakDue()){playBreak();tab="landen";syncTabs();render();toast("Interlandperiode gespeeld.");return;}
  if(cupDue()){playCup();tab="beker";syncTabs();render();return;}
  if(euroDue()){playEuroRound();tab="europa";syncTabs();render();return;}
  const was=windowOpen();
  simRound();
  if(was&&!windowOpen()&&S.round===1) {}
  if(windowOpen()){aiWindow(6);}
  tab="programma"; syncTabs(); render();
};
document.getElementById("btnLive").onclick=()=>{ if(liveMogelijk()) startLive(); };
document.getElementById("btnTerug").onclick=()=>{
  if(LIVE) return;
  ask("Terug naar het startscherm?","Je huidige carrière blijft automatisch bewaard en staat er weer als je verdergaat.","Naar startscherm",()=>{
    save(); S.welkom=true; S.startscherm=false; startLiga=null; startClub=null; render();
  });
};
document.getElementById("btnFive").onclick=()=>{
  const uit=totMijnDuel();
  const boodschap={duel:"Je volgende duel staat klaar.",post:"Er ligt post die je aandacht vraagt.",
    deadline:"Deadline day! De markt sluit vanavond.",oefenduel:"Oefenwedstrijd gespeeld.",klaar:"Seizoen afgerond."};
  tab=uit==="post"?"inbox":"dash"; sectie=uit==="post"?"home":"home";
  syncTabs(); render(); toast(boodschap[uit]||"Doorgespeeld.");
};
document.getElementById("btnSeason").onclick=()=>{toast("Seizoen simuleren, even geduld…");
  setTimeout(()=>{while(S.round<ROUNDS){if(cupDue())playCup();if(euroDue())playEuroRound();if(breakDue())playBreak();simRound();}tab="stand";syncTabs();render();},60);};

if(!load()){ newGame(1); S.welkom=true; }
if(!S.inbox) initV5();
squadClub=S.myClub; syncTabs(); render();
</script>

  window.addEventListener("load",()=>{navigator.serviceWorker.register("./sw.js").catch(()=>{});});
}</script>
