<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1319">
<title>RONDO · voetbalmanager</title>
<style>
:root, html[data-thema="donker"]{
  --bg:#05070a;--surface:#0c1015;--surface-2:#141a22;--line:#1e2833;
  --txt:#f6f9fc;--txt-2:#93a3b6;--accent:#ff7a1a;--club:#ff7a1a;
  --win:#38d178;--draw:#7d8ba0;--loss:#ff5f6d;
  --gold:#f0c74e;--silver:#c9d3df;--bronze:#c58a5b;
  --kop1:#0b0f14;--kop2:#05070a;--balk:rgba(5,7,10,.95);--veld1:#0e2418;--veld2:#122b1d;--zacht:#121821;
  --r:12px;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html[data-thema="licht"]{
  --bg:#eef1f5;--surface:#ffffff;--surface-2:#f2f5f9;--line:#d9dfe7;
  --txt:#131922;--txt-2:#5d6b7d;--accent:#e2650a;--club:#e2650a;
  --win:#159d5c;--draw:#7d8ba0;--loss:#d63b46;
  --gold:#b8860b;--silver:#8a94a3;--bronze:#a3714a;
  --kop1:#ffffff;--kop2:#eef1f5;--balk:rgba(255,255,255,.96);--veld1:#dce9df;--veld2:#e6f0e8;--zacht:#e6eaf0;
}
html{-webkit-text-size-adjust:100%;background:var(--bg);min-height:100%}
body{margin:0;background:var(--bg);min-height:100vh;color:var(--txt);font-family:var(--sans);font-size:16px;line-height:1.45;padding-bottom:96px}
button,select,input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.dim{color:var(--txt-2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:1px;margin-right:6px;flex:0 0 auto}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--kop1),var(--kop2));border-bottom:1px solid var(--line)}
.head-top{display:flex;align-items:center;gap:12px;padding:13px 16px 9px}
.crest{width:34px;height:34px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;font-weight:800;font-size:13px;color:#0b0e13;letter-spacing:-.5px;box-shadow:0 0 0 1px rgba(255,255,255,.14)}
.head-top h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.2px}
.head-top .sub{font-size:13px;color:var(--txt-2)}
.progress{height:3px;background:var(--surface-2)}
.progress i{display:block;height:100%;background:var(--club);transition:width .35s ease}
nav{display:flex;overflow-x:auto;padding:0 8px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;color:var(--txt-2);padding:11px 12px;font-size:14px;font-weight:600;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--txt);border-bottom-color:var(--club)}
main{padding:14px 12px 8px;max-width:640px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 14px 8px;font-size:12px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--txt-2)}
.hint{color:var(--txt-2);font-size:13.5px;padding:0 14px 12px}
.lbl{color:var(--txt-2);font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:8px 14px 0}
.field{padding:12px 14px}
select{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:11px 12px;font-size:15px;font-weight:600}
.btn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:11px 15px;font-size:14px;font-weight:600;margin:0 8px 8px 0}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0b0e13}
.btn.ghost{background:none}
.btn:active{opacity:.75}
.acts{margin-top:16px}
.row{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;padding:9px 14px 9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .pos{text-align:right;font-size:13px;color:var(--txt-2);padding-left:14px;border-left:4px solid transparent}
.row .pos.qual{border-left-color:var(--win)}.row .pos.eu{border-left-color:#5aa9ff}.row .pos.rel{border-left-color:var(--loss)}
.row.mine{background:var(--surface-2)}
.row .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.row .nm small{flex:1 0 100%;font-weight:400;font-size:12.5px;color:var(--txt-2)}
.row .pts{font-size:17px;font-weight:800;min-width:34px;text-align:right;padding-right:2px}
.form{display:flex;gap:3px;margin:4px 0 0 14px}
.form b{width:16px;height:16px;border-radius:4px;font-size:10px;font-weight:700;display:grid;place-items:center;color:#0b0e13}
.form b.W{background:var(--win)}.form b.D{background:var(--draw)}.form b.L{background:var(--loss)}
.newsline{color:var(--txt-2);font-size:13.5px;padding:6px 14px;border-top:1px solid var(--zacht)}
.fix{padding:11px 14px;border-top:1px solid var(--line)}
.fix:first-child{border-top:0}
.fix .line{display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;gap:8px}
.fix .t{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.fix .t.h{justify-content:flex-end;text-align:right}
.fix .sc{background:var(--surface-2);border-radius:8px;padding:5px 0;text-align:center;font-weight:800;font-size:16px}
.fix .sc .pen{font-size:10px;font-weight:600;color:var(--txt-2)}
.fix.mine{background:rgba(255,255,255,.03)}
.fix.mine .sc{background:var(--accent);color:#0b0e13}
.fix .goals{margin-top:6px;font-size:12.5px;color:var(--txt-2);display:grid;grid-template-columns:1fr 70px 1fr;gap:8px}
.fix .goals .h{text-align:right}
.timeline{border-top:1px solid var(--line);padding:6px 0}
.tl{display:grid;grid-template-columns:44px 26px 1fr;align-items:center;padding:5px 14px;font-size:13.5px}
.tl.own{background:rgba(255,255,255,.03)}
.tl .min{color:var(--txt-2);font-size:12.5px}
.tl .ic{font-size:13px}
.tl .tx{display:flex;align-items:center;gap:6px}
.tl .tx .dot{margin-left:auto;margin-right:0}
.p{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.p:active{background:var(--surface-2)}
.p .badge{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#0b0e13}
.p .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.p .meta{font-size:12.5px;color:var(--txt-2);display:flex;align-items:center;gap:5px}
.p .st{font-size:13px;color:var(--txt-2);text-align:right;white-space:nowrap;line-height:1.3}
.xi{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;vertical-align:middle;margin-right:5px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:6px;vertical-align:1px}
.tag.inj{background:#4a1d24;color:#ff9aa2}.tag.ban{background:#4a3a12;color:#ffd479}
.tag.exp{background:#123a4a;color:#8fd8ff}.tag.unh{background:#3d2440;color:#e6a6ff}.tag.cls{background:#123a2a;color:#8ff0c0}
.seg{display:flex;gap:6px;padding:8px 14px 12px;flex-wrap:wrap}
.seg button{background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--txt-2)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#0b0e13}
.pitch{position:relative;margin:12px;border-radius:14px;background:repeating-linear-gradient(0deg,var(--veld1) 0 28px,var(--veld2) 28px 56px);aspect-ratio:3/4;border:1px solid #1d3d2b;overflow:hidden}
.slot{position:absolute;transform:translate(-50%,-50%);width:70px;text-align:center;background:none;border:0;padding:0}
.slot .chip{width:44px;height:44px;margin:0 auto;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#0b0e13;border:2px solid rgba(0,0,0,.28)}
.slot .lb{font-size:11px;color:#eafff2;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.75)}
.slot .rl{font-size:10px;color:#a9d8bf;letter-spacing:.5px}
.slot.empty .chip{background:rgba(0,0,0,.35);color:#cfe8da;border-style:dashed}
.bars{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:0 14px 14px}
.bars div{background:var(--surface-2);border-radius:10px;padding:9px 11px;min-width:0}
.bars span{display:block;font-size:11.5px;color:var(--txt-2)}
.bars b{font-size:16px}
.bar{height:6px;border-radius:99px;background:#2b3644;overflow:hidden;margin-top:5px;display:block}
.bar i{display:block;height:100%;border-radius:99px}
.spark{display:flex;align-items:flex-end;gap:3px;height:52px;padding:0 14px 12px}
.spark i{flex:1;border-radius:2px 2px 0 0;min-height:3px}
.sheet-bg{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 75%,transparent);z-index:40;display:none}
.sheet-bg.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;border-top:1px solid var(--line);padding:18px 16px calc(24px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;transform:translateY(100%);transition:transform .22s ease;max-width:640px;margin:0 auto}
.sheet.open{transform:translateY(0)}
.sheet h3{margin:0;font-size:21px;letter-spacing:-.3px}
.sheet .sub{color:var(--txt-2);font-size:14px;margin:3px 0 14px;display:flex;align-items:center}
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.attr .k{display:flex;justify-content:space-between;color:var(--txt-2);margin-bottom:3px;font-size:13px}
.attr .k b{color:var(--txt)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv div{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.kv span{display:block;font-size:12px;color:var(--txt-2)}
.kv b{font-size:15px}
.controls{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:var(--balk);backdrop-filter:blur(10px);border-top:1px solid var(--line);max-width:640px;margin:0 auto}
.controls button{flex:1;padding:14px 0;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);font-size:14px;font-weight:700}
.controls button.primary{background:var(--club);border-color:var(--club);color:#0b0e13;flex:1.7}
.controls button.live{background:#1d2b3a;border-color:#2f4a63;color:#8fd8ff;flex:1.1}
.controls button:disabled{opacity:.35}
.controls.weg{display:none}
body.geenbalk{padding-bottom:16px}
.toast{position:fixed;left:12px;right:12px;bottom:96px;z-index:50;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:12px 14px;font-size:14px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;max-width:616px;margin:0 auto}
.toast.show{opacity:1;transform:none}
.hide{display:none!important}

.badge-n{display:inline-block;background:var(--accent);color:#0b0e13;font-style:normal;font-weight:800;font-size:11px;padding:0 6px;border-radius:99px;margin-left:4px;vertical-align:1px}
.msg .msgic{background:var(--surface-2);color:var(--txt);font-size:16px}
.msg.un .nm{color:var(--txt)}
.msg .nm{color:var(--txt-2)}
.tag.act{background:#3a2a12;color:#ffcf80}
.tag.euro{background:#12303a;color:#8fe8ff}
optgroup{color:var(--txt-2);font-size:12px}
select.mini{padding:6px 8px;font-size:12px;border-radius:8px;width:130px}
.award{display:flex;justify-content:space-between;gap:10px;padding:7px 14px;border-top:1px solid var(--zacht);font-size:14px}
.award span{color:var(--txt-2)}
.award b{text-align:right}
.award.small{font-size:12.5px;padding:4px 14px}

.sch{display:grid;grid-template-columns:40px 1fr;gap:8px;padding:8px 12px;border-top:1px solid var(--zacht)}
.sch.nu{background:rgba(255,122,26,.10);border-left:3px solid var(--accent)}
.sch.oud{opacity:.68}
.schr{color:var(--txt-2);font-size:11px;text-align:center;padding-top:2px;line-height:1.15;display:flex;flex-direction:column}
.schr b{font-size:14px;color:var(--txt);font-weight:700}
.schl{display:flex;align-items:center;gap:7px;font-size:13.5px;padding:2px 0}
.schl b{font-weight:600;display:flex;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.schl .dim{font-size:11.5px;color:var(--txt-2);white-space:nowrap}
.schl .ic{font-size:13px}
.sres{margin-left:auto;font-weight:800;font-size:13.5px;padding:1px 7px;border-radius:6px}
.sres.win{background:#14361f;color:var(--win)}.sres.loss{background:#3a1a1d;color:var(--loss)}
.sres.draw{background:var(--surface-2);color:var(--txt-2)}
.schl .dim:last-child{margin-left:auto}
.mini-row{display:flex;align-items:center;gap:7px;padding:4px 14px;font-size:13px;color:var(--txt-2)}
.mini-row b{margin-left:auto;color:var(--txt)}
.tag.nt{background:#123a4a;color:#8fd8ff}
.cap{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:4px;background:var(--accent);color:#0b0e13;font-size:10px;font-weight:800;vertical-align:1px}

.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip2{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:8px 10px;
  display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:2px 8px;align-items:center;min-width:132px}
.chip2.eerst{border-color:var(--accent)}
.mini-crest{grid-row:1/3;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:10px;font-weight:800;color:#0b0e13}
.chip2 .cn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92px}
.chip2 .rn{font-size:11px;color:var(--txt-2)}
.hv2{position:absolute}
.chip2 .hv2{position:static;justify-self:end;font-size:10px;font-weight:800;padding:1px 5px;border-radius:5px}
.hv,.hv2{font-size:11px;font-weight:800;padding:1px 6px;border-radius:5px}
.hv.t,.hv2.t{background:#14361f;color:var(--win)}
.hv.u,.hv2.u{background:#2a2f3a;color:var(--txt-2)}
.schl{display:grid;grid-template-columns:20px 1fr auto auto;align-items:center;gap:8px;padding:3px 0;font-size:13.5px}
.schl .opp{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.schl .comp{font-size:11px;color:var(--txt-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.schl .tag2{font-size:11px;color:var(--txt-2)}
.nu-lijn{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);padding:8px 14px 4px;border-top:1px solid var(--accent)}
.mini-btn{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:11px;color:var(--txt-2);font-weight:600}

#tabs{display:block;padding:0}
.sect{display:flex;gap:4px;padding:6px 8px 0}
.sect button{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:9px 9px 0 0;border-bottom:0;
  color:var(--txt-2);padding:9px 4px;font-size:12.5px;font-weight:700;position:relative}
.sect button[aria-selected="true"]{background:var(--surface);color:var(--txt);box-shadow:inset 0 2px 0 var(--club)}
.subs{display:flex;gap:2px;overflow-x:auto;padding:0 8px;background:var(--surface);border-top:1px solid var(--line);scrollbar-width:none}
.subs::-webkit-scrollbar{display:none}
.subs button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;color:var(--txt-2);
  padding:10px 12px;font-size:13.5px;font-weight:600;white-space:nowrap}
.subs button[aria-selected="true"]{color:var(--txt);border-bottom-color:var(--club)}
.hero{padding:26px 16px 10px;text-align:center}
.hero h2{margin:0 0 6px;font-size:24px;letter-spacing:-.4px}
.hero p{margin:0;color:var(--txt-2);font-size:14px}
.ligagrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.ligacard{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 12px;text-align:left}
.ligacard .lignaam{font-size:15px;font-weight:700}
.ligacard .ligland{font-size:12.5px;color:var(--txt-2)}
.ligacard .ligmeta{font-size:11.5px;color:var(--txt-2);margin-top:4px}
.duel .duelrij{display:flex;align-items:center;gap:8px;padding:4px 14px 10px;flex-wrap:wrap}
.duel .vs{color:var(--txt-2);font-size:12.5px}
.mini-crest.big{width:34px;height:34px;border-radius:9px;font-size:12px}
.tabel{display:block;overflow-x:auto}
.tr{display:grid;grid-template-columns:minmax(112px,1.4fr) 38px 30px 30px 34px 44px 44px 78px;align-items:center;gap:2px;
  width:100%;background:none;border:0;border-top:1px solid var(--zacht);padding:8px 12px;text-align:left;font-size:13px}
.tr.kop{color:var(--txt-2);font-size:10.5px;letter-spacing:.5px;border-top:0;font-weight:700}
.tr .tc{text-align:center;font-variant-numeric:tabular-nums}
.tr .tc.naam{text-align:left;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
.tr .tc.naam b{font-weight:600}
.tr .tc.goed{color:var(--win);font-weight:700}
.tr .tc.waarde{text-align:right;color:var(--txt-2);font-size:12px}
.tr .sorteer.actief{color:var(--accent)}
.tr:active{background:var(--surface-2)}
.up{color:var(--win)}.down{color:var(--loss)}
.live .livekop{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:16px 14px 8px}
.live .lteam{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;text-align:center}
.live .lscore{text-align:center}
.live .lscore .num{font-size:30px;font-weight:800;letter-spacing:-1px}
.live .lklok{display:block;font-size:12px;color:var(--accent);font-weight:700}
.lbalk{height:4px;background:var(--surface-2);margin:0 14px 8px;border-radius:99px;overflow:hidden}
.lbalk i{display:block;height:100%;background:var(--accent);transition:width .1s linear}

.welkom{padding:26px 14px 20px;text-align:center;position:relative}
.wlogo h1{font-size:44px;letter-spacing:6px;margin:6px 0 0;font-weight:800}
.wlogo p{margin:2px 0 0;color:var(--txt-2);letter-spacing:3px;font-size:12px;text-transform:uppercase}
.wlogo .bal{font-size:38px;display:inline-block;animation:rol 6s linear infinite}
@keyframes rol{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.wveld{display:flex;gap:5px;justify-content:center;margin:20px 0 24px}
.wveld i{width:7px;height:26px;border-radius:99px;background:var(--surface-2);animation:golf 1.8s ease-in-out infinite;animation-delay:calc(var(--i)*.12s)}
@keyframes golf{0%,100%{height:14px;background:var(--surface-2)}50%{height:34px;background:var(--accent)}}
.wknoppen{display:grid;gap:10px;max-width:320px;margin:0 auto}
.btn.groot{width:100%;padding:15px;font-size:15px;margin:0}
.slotrij{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.slotinfo{display:flex;flex-direction:column;min-width:0}
.slotinfo .dim{font-size:12px}
.slotknop{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 14px 10px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--txt-2)}
.filters input{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px;width:100%}
input[type=search]{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:11px 12px;font-size:15px}
input[type=range]{width:100%;accent-color:var(--accent)}
.shiftlabels{display:flex;justify-content:space-between;font-size:11px;color:var(--txt-2);margin-top:2px}

.merkbalk{display:flex;align-items:center;gap:9px;padding:2px 4px 12px}
.merkbalk img{width:30px;height:30px;border-radius:9px}
.merkbalk span{font-weight:800;letter-spacing:3px;font-size:13px}
.merkbalk i{margin-left:auto;font-style:normal;font-size:12px;color:var(--txt-2)}
.hlogo{width:26px;height:26px;border-radius:7px;flex:0 0 auto;opacity:.95}
.wlogoimg{width:104px;height:104px;border-radius:26px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.kaartwrap{padding:6px 0 10px}
.kaartkop{display:flex;align-items:center;gap:12px;padding:8px 14px 12px}
.kaartkop .klogo{width:44px;height:44px;border-radius:12px}
.kaartkop h2{margin:0;font-size:19px}
.kaartkop p{margin:1px 0 0;color:var(--txt-2);font-size:13px}
.europa{width:100%;height:auto;border-radius:14px;border:1px solid var(--line);background:#0f1319;overflow:hidden}
.europa .grid line{stroke:rgba(255,255,255,.045);stroke-width:1}
.europa .wereld{transition:transform .62s cubic-bezier(.5,.05,.3,1);transform-origin:0 0}
.europa .pass{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:9 11;opacity:0;
  animation:passIn .8s ease-out forwards, passLoop 2.4s linear infinite;animation-delay:var(--d),var(--d)}
@keyframes passIn{to{opacity:.42}}
@keyframes passLoop{to{stroke-dashoffset:-40}}
.landpunt{cursor:pointer;opacity:0;animation:puntIn .55s ease-out forwards;animation-delay:var(--d)}
@keyframes puntIn{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
.landpunt .halo{opacity:.13;animation:pols 3s ease-in-out infinite}
@keyframes pols{0%,100%{opacity:.10;transform:scale(.85)}50%{opacity:.24;transform:scale(1.08)}}
.landpunt .kern{filter:drop-shadow(0 0 8px currentColor)}
.landpunt .ring{stroke-width:2;opacity:.35;stroke-dasharray:4 6}
.landpunt .lnaam{fill:#f1f5f9;font-size:22px;font-weight:700;text-anchor:middle}
.landpunt .lliga{fill:#aebbcc;font-size:16px;text-anchor:middle}
.landpunt.klein .lnaam{font-size:17px;fill:#aebbcc}
.landpunt.klein .lliga{font-size:13px}
.landpunt:active .kern{transform:scale(1.15)}
.clubkeuze{padding-bottom:10px}
.ckkop{display:flex;align-items:center;gap:10px;padding:8px 14px 12px}
.ckkop b{font-size:17px}
.ckhero{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;background:
  linear-gradient(135deg,color-mix(in srgb,var(--c) 26%,var(--surface)),var(--surface));
  border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 12px 12px}
.ckhero.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.97);opacity:.6}100%{transform:scale(1);opacity:1}}
.ckshirt .shirt{width:100%;height:auto;animation:zweef 3.4s ease-in-out infinite}
@keyframes zweef{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-7px) rotate(1.5deg)}}
.ckinfo h2{margin:6px 0 0;font-size:21px;letter-spacing:-.3px}
.ckinfo p{margin:2px 0 0;color:var(--txt-2);font-size:13px}
.ckdoel{margin-top:8px!important;font-size:12.5px}
.ckstats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.ckstats span{background:color-mix(in srgb,var(--bg) 45%,transparent);border-radius:9px;padding:6px 9px;font-size:11px;color:var(--txt-2);display:flex;flex-direction:column}
.ckstats b{font-size:14px;color:var(--txt)}
.crest{width:34px;height:38px}
.crest.groot{width:44px;height:50px}
.ckgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px 14px}
.ckclub{display:grid;grid-template-columns:34px 1fr;grid-template-rows:auto auto;gap:2px 9px;align-items:center;
  background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:9px;text-align:left}
.ckclub.actief{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.ckclub .crest{grid-row:1/3}
.ckclub .ckn{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ckclub .ckb{font-size:11px;color:var(--txt-2)}

.terug{background:var(--surface-2);border:1px solid var(--line);color:var(--txt);width:32px;height:32px;
  border-radius:9px;font-size:20px;line-height:1;flex:0 0 auto;display:grid;place-items:center;padding:0 0 3px}
.terug.weg{display:none}
.clublogo{flex:0 0 auto;vertical-align:middle}
.crest{overflow:hidden}

.dashkop{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:14px;
  background:linear-gradient(120deg,color-mix(in srgb,var(--c) 30%,var(--surface)),var(--surface));
  border:1px solid var(--line);border-radius:16px;margin-bottom:12px}
.dashkop h2{margin:0;font-size:20px;letter-spacing:-.3px}
.dashkop p{margin:2px 0 0;color:var(--txt-2);font-size:12.5px}
.dashlogo{width:30px;height:30px;border-radius:9px;opacity:.85}
.statrij{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.statrij div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.statrij b{display:block;font-size:19px;font-weight:800;letter-spacing:-.5px}
.statrij sup{font-size:11px}
.statrij span{font-size:10.5px;color:var(--txt-2);text-transform:uppercase;letter-spacing:.6px}
.duelkaart{background:linear-gradient(135deg,color-mix(in srgb,var(--h,#222) 24%,var(--surface)),
  color-mix(in srgb,var(--u,#222) 24%,var(--surface)));border:1px solid var(--line);border-radius:16px;
  overflow:hidden;margin-bottom:12px}
.dk-top{display:flex;justify-content:space-between;padding:11px 14px 0;font-size:11.5px;
  color:var(--txt-2);text-transform:uppercase;letter-spacing:.7px;font-weight:700}
.dk-mid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:14px 10px 12px}
.dk-team{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-width:0}
.dk-team b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.dk-team span{font-size:10.5px;color:var(--txt-2);text-transform:uppercase;letter-spacing:.6px}
.dk-vs{text-align:center}
.dk-vs .vs{font-size:20px;font-weight:800;letter-spacing:1px;opacity:.65}
.dk-r{display:block;font-size:10.5px;color:var(--txt-2);margin-top:2px}
.dk-bar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 55%,transparent)}
.dk-bar span{padding:8px 4px;text-align:center;font-size:10.5px;color:var(--txt-2)}
.dk-bar b{display:block;font-size:15px;color:var(--txt)}
.snelrij{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.snel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 4px;
  font-size:11px;color:var(--txt-2);font-weight:600;display:grid;gap:3px;justify-items:center}
.snel span{font-size:18px}
.snel:active{background:var(--surface-2)}
.vormrij{display:flex;align-items:center;gap:10px;padding:2px 14px 8px}
.vormrij .form{margin:0}
.mini-stand{display:grid;grid-template-columns:22px auto 1fr 26px 30px;align-items:center;gap:8px;
  padding:7px 14px;border-top:1px solid var(--zacht);font-size:13.5px}
.mini-stand.ik{background:var(--surface-2);font-weight:700}
.mini-stand .mp{color:var(--txt-2);font-size:12px;text-align:right}
.mini-stand .mn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-stand .mg,.mini-stand .mpt{text-align:right;font-variant-numeric:tabular-nums}
.mini-stand .mg{color:var(--txt-2);font-size:12px}
.zorgen{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.zorgen span{background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:5px 10px;font-size:12px;color:var(--txt-2)}

.wtop{display:flex;justify-content:flex-end;padding:6px 4px 0}
.wthema{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px}
.tbtn{background:none;border:0;color:var(--txt-2);font-size:12px;font-weight:700;padding:6px 11px;border-radius:99px}
.tbtn.aan{background:var(--accent);color:#0b0e13}
.whero{position:relative;text-align:center;padding:22px 0 6px}
.wgloed{position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--accent) 26%,transparent),transparent 62%);
  filter:blur(6px);pointer-events:none;animation:ademen 5s ease-in-out infinite}
@keyframes ademen{0%,100%{opacity:.55}50%{opacity:1}}
.wsub{margin:2px 0 0;color:var(--txt-2);letter-spacing:4px;font-size:11.5px;text-transform:uppercase}
.wdoor{width:100%;display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;
  background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 22%,var(--surface)),var(--surface));
  border:1px solid var(--accent);border-radius:14px;padding:13px 15px;margin:6px 0 10px}
.wdlabel{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--accent);font-weight:800}
.wdclub{font-size:18px;font-weight:800;grid-column:1}
.wdmeta{grid-column:1;font-size:12.5px;color:var(--txt-2)}
.wdpijl{grid-row:1/4;grid-column:2;align-self:center;font-size:20px;color:var(--accent)}
.wfeit{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 12px}
.wfeit div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 4px;text-align:center}
.wfeit b{display:block;font-size:17px;font-weight:800}
.wfeit span{font-size:10px;color:var(--txt-2);text-transform:uppercase;letter-spacing:.4px}
.wvoet{text-align:center;color:var(--txt-2);font-size:12px;padding:10px 6px 0}

.dk-knop{padding:0 12px 10px;text-align:center}
.dk-knop .btn{margin:0;width:100%;background:color-mix(in srgb,var(--bg) 45%,transparent)}
.analysekop{display:flex;align-items:center;gap:12px;padding:6px 0 12px}
.verg{display:grid;grid-template-columns:86px 1fr 34px 34px;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.verg span{color:var(--txt-2);font-size:12px}
.verg .vb{display:block;height:8px;border-radius:99px;background:var(--loss);overflow:hidden}
.verg .vb i{display:block;height:100%;background:var(--accent)}
.verg b{text-align:right;font-variant-numeric:tabular-nums}
.verg b.hun{color:var(--loss)}
.trainerkop{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);
  border:1px solid var(--line);border-radius:16px;margin-bottom:12px}
.tavatar{width:52px;height:52px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;font-size:24px}
.trainerkop h2{margin:0;font-size:19px}
.trainerkop p{margin:2px 0 0;color:var(--txt-2);font-size:13px}
.loopbaan{display:grid;grid-template-columns:64px 1fr 34px 40px;align-items:center;gap:8px;
  padding:8px 14px;border-top:1px solid var(--zacht);font-size:13.5px}
.loopbaan .lj{color:var(--txt-2);font-size:12px}
.loopbaan .lc{display:flex;flex-direction:column;min-width:0}
.loopbaan .lc .dim{font-size:11.5px}
.loopbaan .lp{text-align:right;font-weight:700}
.loopbaan .lpr{text-align:right;font-size:11px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    for(let i=0;i<n/2;i++){const h=arr[i],a=arr[n-1-i];round.push(r%2===0?{h,a}:{h:a,a:h});}
    half.push(round);arr.splice(1,0,arr.pop());
  }
  return half.concat(half.map(r=>r.map(m=>({h:m.a,a:m.h}))));
}
function buildCups(){

/* ---------------- speler-kracht ---------------- */
function mult(p){ return (1+.07*p.form)*(1+.04*(p.morale-70)/30); }
const att_ = p => {
  const m=mult(p), [pac,sho,pas,dri]=p.a;
  if(p.pos==="AV") return m*(.42*sho+.26*dri+.16*pas+.16*pac);
  if(p.pos==="MID")return m*(.34*pas+.28*dri+.22*sho+.16*pac);
  if(p.pos==="VD") return m*(.45*pas+.30*pac+.25*dri);
  return m*p.ovr*.6;
};
const def_ = p => {
  const m=mult(p);
  if(p.pos==="GK") return m*(.40*p.a[5]+.30*p.a[1]+.20*p.a[4]+.10*p.a[2]);
  const [pac,,,,dfn,phy]=p.a;
  return m*(.55*dfn+.32*phy+.13*pac);
};
const mid_ = p => mult(p)*(p.pos==="GK"?40:.45*p.a[2]+.30*p.a[3]+.25*p.a[5]);
function fam(p,slot){
  if(p.poss.includes(slot)) return 1;
  const g=GROUP[slot];
  if(p.pos===g) return .92;
  if(p.pos==="GK"||g==="GK") return .45;
  const o=["VD","MID","AV"];
  return Math.abs(o.indexOf(p.pos)-o.indexOf(g))===1?.82:.68;
}
const fitF=p=>.80+.20*clamp(p.cond,0,100)/100;
const available=p=>p.inj===0&&p.ban===0;
function slotFit(p,slot){
  const w=SLOTW[slot];
  return (w.a*att_(p)+w.d*def_(p)+(slot==="GK"?def_(p)*1.3:0))*fam(p,slot)*fitF(p);
}
function autoXI(cid,formation){
  const slots=FORMATIONS[formation||"4-3-3"];
  const pool=squad(cid).filter(available);
  const used=new Set(), xi=[];
  slots.forEach((s,i)=>{
    let cand=pool.filter(p=>!used.has(p.id)&&(s[0]==="GK"?p.pos==="GK":p.pos!=="GK"));
    if(!cand.length) cand=pool.filter(p=>!used.has(p.id));
    cand.sort((a,b)=>slotFit(b,s[0])-slotFit(a,s[0]));
    if(cand[0]){used.add(cand[0].id);xi[i]=cand[0].id;} else xi[i]=null;
  });
  return xi;
}
function styleOf(mentality,pressing){
  if(pressing==="Hoog") return "gegenpress";
  if(mentality==="Zeer defensief"||mentality==="Defensief") return "counter";
  return "balbezit";
}
let SETUP_CACHE=null, SETUP_KEY=-1;
function setupCached(cid){
  if(SETUP_KEY!==S.round||!SETUP_CACHE){SETUP_CACHE={};SETUP_KEY=S.round;}
  if(!SETUP_CACHE[cid]) SETUP_CACHE[cid]=setup(cid);

function clearSetup(){SETUP_CACHE=null;SETUP_KEY=-1;}
function setup(cid){
  const mine=cid===S.myClub;
  const tac=mine?S.tactics:{formation:"4-3-3",mentality:S.clubs[cid].tactic,
    pressing:S.clubs[cid].prestige>73?"Hoog":S.clubs[cid].prestige>68?"Middel":"Laag"};
  const slots=FORMATIONS[tac.formation];
  let xi;
  if(mine){
    const ok=S.lineup.length===11&&S.lineup.every(id=>{const p=byId(id);return p&&p.club===cid&&available(p);});
    if(!ok) S.lineup=autoXI(cid,tac.formation);
    xi=S.lineup.map(byId);
  } else xi=autoXI(cid,tac.formation).map(byId);
  let A=0,D=0,M=0,gk=58,mw=0,ms=0;
  xi.forEach((p,i)=>{
    if(!p) return;
    const s=slots[i]?slots[i][0]:"CM", w=SLOTW[s];
    mw++; ms+=fam(p,s)*fitF(p);
    M+=w.m*mid_(p);
    if(s==="GK"){gk=def_(p);return;}
    A+=w.a*att_(p); D+=w.d*def_(p);
  });
  return {cid,xi,slots,tac,style:styleOf(tac.mentality,tac.pressing),
    att:A/REF_A, def:(D/REF_D)*.74+gk*.26, mid:M/REF_M, gk,
    mod:mw?ms/mw:1, subs:0, ratings:{}};
}

/* ---------------- wedstrijd: micro-duels ---------------- */
function pickShooter(T){
  const w={GK:0,VD:.11,MID:.40,AV:.85};
  const pool=T.xi.filter(Boolean).map(p=>({p,w:w[p.pos]*Math.pow((p.a[1]||60)/68,1.35)}));
  let t=pool.reduce((s,x)=>s+x.w,0)*Math.random();
  for(const x of pool){t-=x.w;if(t<=0)return x.p;}
  return pool[pool.length-1].p;
}
function bench(cid,xi){
  return squad(cid).filter(p=>available(p)&&!xi.some(x=>x&&x.id===p.id)).sort((a,b)=>b.ovr-a.ovr);
}
function subIn(T,minute,timeline){
  if(T.subs>=3) return;
  const tired=T.xi.map((p,i)=>({p,i})).filter(x=>x.p&&x.p.pos!=="GK"&&x.p.cond<62)
    .sort((a,b)=>a.p.cond-b.p.cond)[0];
  if(!tired) return;
  const b=bench(T.cid,T.xi).filter(p=>p.pos!=="GK"&&p.cond>75);
  const slot=T.slots[tired.i][0];
  b.sort((x,y)=>slotFit(y,slot)-slotFit(x,slot));
  if(!b[0]) return;
  const inP=b[0], outP=tired.p;
  T.xi[tired.i]=inP; T.subs++;
  T.ratings[inP.id]={g:0,base:6.3,mins:90-minute};
  timeline.push({min:minute,type:"sub",c:T.cid,n:inP.name,out:outP.name});
}
function poisson(l){let L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random();}while(p>L);return k-1;}
function simLight(hid,aid,opt){
  const H=setupCached(hid), A=setupCached(aid), lg=opt.lg||leagueAvg(), ctx=opt.ctx||"lg";
  const edgeH=STYLE_EDGE[H.style][A.style], edgeA=STYLE_EDGE[A.style][H.style];
  const hAdv=opt.neutral?1:1.10, aAdv=opt.neutral?1:.92;
  const BASE=engineParams.LBASE, EXP=engineParams.LEXP;
  const xh=clamp(BASE*Math.pow((H.att/lg.a)*(lg.d/A.def),EXP)*hAdv*edgeH*(H.mod/A.mod),.10,5.5);
  const xa=clamp(BASE*Math.pow((A.att/lg.a)*(lg.d/H.def),EXP)*aAdv*edgeA*(A.mod/H.mod),.10,5.5);
  const hg=poisson(xh), ag=poisson(xa), sc=[];
  [[H,hg,"h"],[A,ag,"a"]].forEach(([T,n,t])=>{
    for(let i=0;i<n;i++){
      const p=pickShooter(T); if(!p) continue;
      p.goals++; stOf(p,ctx).g++; stOf(p,ctx).sh++;
      sc.push({t,n:p.name,min:ri(3,90)});
      if(Math.random()<.62){
        const k=T.xi.filter(x=>x&&x.id!==p.id&&x.pos!=="GK");
        if(k.length) stOf(k[ri(0,k.length-1)],ctx).a++;
      }
    }
  });
  let pens=null;
  if(opt.cup&&hg===ag){
    const hp=mean(H.xi.filter(Boolean).map(p=>p.ovr)), ap=mean(A.xi.filter(Boolean).map(p=>p.ovr));
    const hw=Math.random()<hp/(hp+ap), lo=ri(2,4);
    pens=hw?[lo+ri(1,2),lo]:[lo,lo+ri(1,2)];
  }
  const events=[];
  [[H,hid,ag],[A,aid,hg]].forEach(([T,cid,tegen])=>{
    const intens=S.clubs[cid].prestige>73?1.1:.95;
    T.xi.forEach(p=>{
      if(!p) return;
      const st=stOf(p,ctx);
      p.apps++; st.ap++; st.min+=90;
      st.sh+=Math.random()<.45?1:0;
      p.cond=clamp(p.cond-Math.round(rf(9,16)*intens),0,100);
      if(tegen===0&&(p.pos==="GK"||p.pos==="VD")) st.cs++;
      if(Math.random()<.17) st.yc++;
      const risk=.011*intens*(1+(100-p.cond)/130)*(p.age>=31?1.35:1);
      if(Math.random()<risk){p.inj=ri(1,8);events.push({c:cid,type:"inj",n:p.name,w:p.inj});}
      else if(Math.random()<.011){p.ban=1;st.rc++;events.push({c:cid,type:"red",n:p.name});}
      const gd=(cid===hid?hg-ag:ag-hg);
      let rating=6.3+gd*.16+rf(-.45,.45)+(tegen===0&&(p.pos==="VD"||p.pos==="GK")?.5:0);
      rating=clamp(rating,3.5,10);
      p.rSum+=rating;p.rN+=1;st.rs+=rating;st.rn+=1;
      p.form=clamp(p.form*.82+(rating-6.6)*.20,-1,1);
      p.morale=clamp(p.morale+(gd>0?1.6:gd<0?-1.4:0)+1.2,0,100);
    });
    squad(cid).forEach(p=>{if(T.xi.indexOf(p)<0){p.cond=clamp(p.cond+ri(4,9),0,100);p.morale=clamp(p.morale-.9,0,100);}});
  });
  return {h:hid,a:aid,hg,ag,pens,timeline:[],sc,events,cup:!!opt.cup};
}
function simMatch(hid,aid,opt){
  opt=opt||{};
  if(hid!==S.myClub&&aid!==S.myClub&&!opt.fresh) return simLight(hid,aid,opt);
  const M=matchStart(hid,aid,opt);
  matchSegments(M,18,18);

/* live: eerste helft, dan rust, dan tweede helft */
function liveStart(hid,aid,opt){const M=matchStart(hid,aid,opt);matchSegments(M,18,9);return M;}
function liveSecond(M){matchSegments(M,18,18);return matchFinish(M);}
function liveSub(M,uitId,inId){

function matchStart(hid,aid,opt){
  opt=opt||{};
  const H=opt.fresh?setup(hid):setupCached(hid), A=opt.fresh?setup(aid):setupCached(aid);
  const lg=opt.lg||leagueAvg();
  const ctx=opt.ctx||"lg";
  const hAdv=opt.neutral?1.0:1.14, aAdv=opt.neutral?1.0:0.90;
  [H,A].forEach(T=>T.xi.forEach(p=>{if(p)T.ratings[p.id]={g:0,base:6.3,mins:90};}));
  const timeline=[]; let hg=0, ag=0;
  const menH=MENTALITY[H.tac.mentality], menA=MENTALITY[A.tac.mentality];
  H.mod*=chemistry(hid); A.mod*=chemistry(aid);
  if(S.press&&(hid===S.myClub||aid===S.myClub)&&S.press.opp!=null){
    if(S.press.opp===hid) H.mod*=S.press.boost; else if(S.press.opp===aid) A.mod*=S.press.boost;
  }
  const edgeH=STYLE_EDGE[H.style][A.style], edgeA=STYLE_EDGE[A.style][H.style];
  return {H,A,lg,ctx,hAdv,aAdv,timeline,hg,ag,menH,menA,edgeH,edgeA,opt,hid,aid,seg:0};
}
function matchSegments(M,tot,eind){
  const {H,A,lg,ctx,hAdv,aAdv,timeline,menH,menA,edgeH,edgeA}=M;
  for(let seg=M.seg;seg<eind;seg++){
    const minute=seg*5+ri(1,5);
    if(minute>58){ subIn(H,minute,timeline); subIn(A,minute,timeline); }
    // conditie loopt terug binnen de wedstrijd
    const wear=(T)=>T.xi.forEach(p=>{if(p)p._w=(p._w||0)+rf(.4,.9)*(T.cid===S.myClub?PRESSING[S.tactics.pressing].drain:1);});
    wear(H); wear(A);
    const powH=H.mid*edgeH*(H.mod)*menH.a, powA=A.mid*edgeA*(A.mod)*menA.a;
    const attacker = Math.random() < powH/(powH+powA) ? H : A;
    const defender = attacker===H ? A : H;
    const men = attacker===H?menH:menA, menD = defender===H?menH:menA;
    const edge = attacker===H?edgeH:edgeA;
    const adv = attacker===H?hAdv:aAdv;
    // kans op een kans
    const ratio=(attacker.att*men.a*attacker.mod)/(defender.def*menD.d*defender.mod);
    const pChance=clamp(CH*Math.pow(ratio,1.55)*edge*adv,.03,.85);
    if(Math.random()>pChance) continue;
    const shooter=pickShooter(attacker);
    if(!shooter) continue;
    // afronding: schot vs keeper
    const keeper=defender.xi.find(p=>p&&p.pos==="GK");
    const fin=(shooter.a[1]||60)*mult(shooter), gkq=keeper?def_(keeper):lg.gk*.9;
    const conv=clamp(CV*Math.pow((fin/lg.fin)/(gkq/lg.gk),1.5),.05,.75);
    stOf(shooter,ctx).sh++;
    if(Math.random()<conv){
      shooter.goals++; attacker.ratings[shooter.id].g++; stOf(shooter,ctx).g++;
      if(attacker===H)M.hg++; else M.ag++;
      let assist=null;
      if(Math.random()<.62){
        const kand=attacker.xi.filter(p=>p&&p.id!==shooter.id&&p.pos!=="GK");
        if(kand.length){
          let t=0; const w=kand.map(p=>{const x=(p.a[2]||60)*(p.pos==="MID"?1.3:p.pos==="AV"?1.1:.7);t+=x;return x;});
          let r=Math.random()*t;
          for(let i=0;i<kand.length;i++){r-=w[i];if(r<=0){assist=kand[i];break;}}
        }
      }
      if(assist){stOf(assist,ctx).a++; if(attacker.ratings[assist.id])attacker.ratings[assist.id].as=(attacker.ratings[assist.id].as||0)+1;}
      timeline.push({min:minute,type:"goal",c:attacker.cid,n:shooter.name,as:assist?assist.name:null,
        sc:(attacker===H?M.hg:M.hg)+"-"+(attacker===H?M.ag:M.ag)});
    }
  }
  M.seg=eind;
  return M;
}
function matchFinish(M){
  const {H,A,lg,ctx,timeline,opt,hid,aid}=M;
  let hg=M.hg, ag=M.ag;
  let pens=null;
  if(opt.cup&&hg===ag){
    const hp=mean(H.xi.filter(Boolean).map(p=>p.ovr)), ap=mean(A.xi.filter(Boolean).map(p=>p.ovr));
    const hw=Math.random()<hp/(hp+ap), lo=ri(2,4);
    pens=hw?[lo+ri(1,2),lo]:[lo,lo+ri(1,2)];
  }
  // nawerk: conditie, blessures, kaarten, beoordelingen, moraal
  const gdOf=T=>T===H?hg-ag:ag-hg, gaOf=T=>T===H?ag:hg;
  [H,A].forEach(T=>{
    const intensity=(T.cid===S.myClub?PRESSING[S.tactics.pressing].drain:(S.clubs[T.cid].prestige>73?1.15:.95));
    const gd=gdOf(T), ga=gaOf(T);
    Object.keys(T.ratings).forEach(idS=>{
      const p=byId(+idS), r=T.ratings[idS];
      if(!p) return;
      const share=r.mins/90;
      p.apps+=share>=.5?1:0;
      p.cond=clamp(p.cond-Math.round(rf(9,16)*intensity*share),0,100);
      // blessurekans: conditie, leeftijd, intensiteit
      const risk=.011*share*intensity*(1+(100-p.cond)/130)*(p.age>=31?1.35:p.age<=21?1.15:1);
      const S2=stOf(p,ctx==="pre"?"cup":ctx);
      if(opt.vriend){p.cond=clamp(p.cond+6,0,100);}
      else S2.ap+=share>=.5?1:0; S2.min+=Math.round(r.mins);
      if(ga===0&&(p.pos==="GK"||p.pos==="VD")&&share>=.6) S2.cs++;
      if(Math.random()<.17+(p.pos==="VD"?.06:0)) S2.yc++;
      if(Math.random()<risk){p.inj=ri(1,8);timeline.push({min:ri(5,88),type:"inj",c:T.cid,n:p.name,w:p.inj});}
      else if(Math.random()<.011*share){p.ban=1;S2.rc++;timeline.push({min:ri(20,90),type:"red",c:T.cid,n:p.name});}
      // beoordeling
      let rating=6.3+r.g*.85+gd*.16+rf(-.45,.45);
      if(p.pos==="VD"||p.pos==="GK") rating+= (ga===0?.55:-.22*ga);
      if(p.pos==="GK") rating+=.2;
      rating=clamp(rating*(share<.5?.98:1),3.5,10);
      p.rSum+=rating*share; p.rN+=share;
      S2.rs+=rating*share; S2.rn+=share;
      // vorm-momentum
      p.form=clamp(p.form*.82+(rating-6.6)*.20,-1,1);
      p.morale=clamp(p.morale+(gd>0?1.6:gd<0?-1.4:0)+(share>=.5?1.2:-.8),0,100);
    });
    squad(T.cid).forEach(p=>{
      if(T.ratings[p.id]===undefined){
        p.cond=clamp(p.cond+ri(4,9),0,100);
        p.morale=clamp(p.morale-(available(p)?.9:.2),0,100);
        p.form=p.form*.94;
      }
      delete p._w;
    });
  });
  timeline.sort((a,b)=>a.min-b.min);
  return {h:hid,a:aid,hg,ag,pens,timeline,cup:!!opt.cup,
    sc:timeline.filter(t=>t.type==="goal").map(t=>({t:t.c===hid?"h":"a",n:t.n,min:t.min})),
    events:timeline.filter(t=>t.type==="inj"||t.type==="red").map(t=>({c:t.c,type:t.type,n:t.n,w:t.w}))};
}
function leagueAvg(){
  if(S.lgAvg&&S.lgAvgRound===S.round) return S.lgAvg;

  const gks=[],fins=[];
  all.forEach(s=>s.xi.forEach(p=>{if(!p)return;if(p.pos==="GK")gks.push(def_(p));else if(p.pos!=="VD")fins.push(p.a[1]);}));
  S.lgAvg={a:mean(all.map(s=>s.att)),d:mean(all.map(s=>s.def)),m:mean(all.map(s=>s.mid)),
          gk:mean(gks)||65, fin:mean(fins)||68};

}

function simRound(mijn){

function playCup(vooraf,paren){
  const lg=leagueAvg();
  const mijnCup=S.leagues[S.clubs[S.myClub].league].cupIx;
  S.cups.forEach((c,ci)=>{
    if(c.played.indexOf(S.round)>=0||c.winner!=null) return;
    playCupFor(ci,lg,ci===mijnCup?vooraf:null,ci===mijnCup?paren:null);
  });
  recover(); save();
}
function cupPairing(c){
  if(c.loting&&c.loting.round===S.round) return c.loting;
  const n=c.alive.length;
  const doel = n>32?32 : n>16?16 : n>8?8 : n>4?4 : n>2?2 : 1;
  const extra=n-doel;
  let ties=[], byes=[];
  if(extra>0){
    const zwak=c.alive.slice().sort((a,b)=>S.clubs[a].prestige-S.clubs[b].prestige).slice(0,extra*2);
    for(let i=0;i+1<zwak.length;i+=2) ties.push([zwak[i],zwak[i+1]]);
    byes=c.alive.filter(t=>zwak.indexOf(t)<0);
  }else{
    const t=c.alive.slice().sort(()=>Math.random()-.5);
    for(let i=0;i+1<t.length;i+=2) ties.push([t[i],t[i+1]]);
  }
  c.loting={ties,byes,name:cupRondeNaam(n),round:S.round};
  return c.loting;
}
function playCupFor(ci,lg,vooraf,paren){
  const c=S.cups[ci];
  const P=paren||cupPairing(c);
  const ties=P.ties, byes=P.byes, name=P.name;
  const finale=c.alive.length===2;
  const res=ties.map(t=>{
    if(vooraf&&((t[0]===vooraf.h&&t[1]===vooraf.a)||(t[0]===vooraf.a&&t[1]===vooraf.h))) return vooraf;
    return simMatch(t[0],t[1],{cup:true,lg,ctx:"cup",neutral:finale});
  });
  const winners=res.map(m=>m.pens?(m.pens[0]>m.pens[1]?m.h:m.a):(m.hg>m.ag?m.h:m.a));
  logEvents(res," in de beker");
  const mine=res.find(m=>m.h===S.myClub||m.a===S.myClub);
  if(mine) S.reports=[{round:c.naam+" · "+name,soort:"beker",m:mine}].concat(S.reports).slice(0,8);
  c.done.push({name,round:S.round,matches:res});
  c.alive=winners.concat(byes);
  if(c.alive.length===1){
    c.winner=c.alive[0];
    const tv=S.clubs[c.winner].league>=0?S.leagues[S.clubs[c.winner].league].tv:.2;
    S.clubs[c.winner].balance+=Math.round(2600*(1+tv));
    msg("nieuws","🏆 "+c.naam,`${S.clubs[c.winner].name} wint de ${c.naam}.`);
  }
  c.played.push(S.round); c.loting=null;
  matchdayFinance(res); return res;
}
function attendance(cid,opp){
  const c=S.clubs[cid];
  if(c.league<0) return Math.round(c.cap*.8);
  const t=table(c.league), pos=t.findIndex(x=>x.id===cid)+1||9;
  const formPts=mean((t.find(x=>x.id===cid)||{form:[]}).form.slice(-5).map(f=>f==="W"?1:f==="D"?.5:0))||.5;
  const pull=clamp(.62+.014*(19-pos)+.18*formPts+.004*(S.clubs[opp].prestige-68),.45,1);
  return Math.round(c.cap*pull);
}
function matchdayFinance(round){
  round.forEach(m=>{
    const att=attendance(m.h,m.a), c=S.clubs[m.h];
    const gate=Math.round(att*c.ticket/1000);            // in duizenden
    const merch=Math.round(gate*.30);
    c.balance+=gate+merch; c.income+=gate+merch;
  });
  S.clubs.forEach(c=>{
    const w=Math.round(wageBill(c.id)*1.6/1000);          // salarissen incl. werkgeverslasten
    const staff=Math.round(c.prestige*1.7);               // staf en organisatie
    const f=tvOf(c);
    const tv=Math.round((260+(c.prestige-64)*16)*(.35+f*1.5));   // mediagelden per speelronde
    const comm=Math.round((150+(c.reputation||20)*11)*(.5+f));   // sponsoring en commercie
    const invest=Math.round(Math.max(0,c.balance)*.010);   // herinvestering in club en stadion
    c.balance+=tv+comm-w-staff-invest; c.income+=tv+comm; c.costs+=w+staff+invest;
  });
  const me=S.clubs[S.myClub];
  S.finance.push({r:S.round,bal:me.balance});
  if(S.finance.length>40) S.finance.shift();
}
function tvOf(c){if(c.league==null||c.league<0) return .22;
  return (S&&S.leagues?S.leagues[c.league].tv:DB.leagues[c.league].tv);}
function expectedIncome(c){
  const tv=tvOf(c);
  const gate=17*Math.round(c.cap*.8*c.ticket/1000)*1.3;
  const media=38*Math.round((260+(c.prestige-64)*16)*(.35+tv*1.5));
  const comm=38*Math.round((150+Math.max(0,c.reputation!=null?c.reputation:(c.prestige-58)*4.2)*11)*(.5+tv));
  const euro=c.euro?({CL:9000,EL:3200,ECL:1400})[c.euro]||0:0;
  return Math.round(gate+media+comm+euro);
}
function setBudgets(){S.clubs.forEach(c=>{c.wageBasis=Math.round(expectedIncome(c)*.60/34*1000);
  c.wageBudget=Math.round(c.wageBasis*(1+(c.shift||0)*.22));});}
function setShift(cid,v){
  const c=S.clubs[cid];
  c.shift=clamp(v,-1,1);
  c.wageBudget=Math.round((c.wageBasis||c.wageBudget)*(1+c.shift*.22));
  save();
}
function transferBudget(cid){
  const c=S.clubs[cid];
  const markt=16000*Math.pow(expectedIncome(c)/50000,1.67)*(1-(c.shift||0)*.30);   // schaal zoals in FM en FC career mode
  const saldo=(c.transferIn||0)-(c.transferUit||0);            // verkopen vullen je pot direct aan
  return Math.max(0,Math.round(markt+saldo));
}

/* ---------------- moraal & bestuur ---------------- */
function moraleTick(){
  S.clubs.forEach(c=>{
    const sq=squad(c.id);
    if(!sq.length) return;
    const top=sq.slice().sort((a,b)=>b.wage-a.wage).slice(0,5).map(p=>p.id);
    const rank=sq.slice().sort((a,b)=>b.ovr-a.ovr);
    const xiLevel=rank[Math.min(10,rank.length-1)].ovr;   // niveau van je elfde man
    sq.forEach(p=>{
      const played=p.apps/Math.max(1,S.round);
      let d=(66-p.morale)*.05;                            // moraal zakt vanzelf terug naar normaal
      if(played<.30&&p.ovr>=xiLevel) d-=1.1;              // basisspeler op de bank
      if(played>.65) d+=.5;
      if(top.includes(p.id)) d+=.2;
      if(yearsLeft(p)<=1) d-=.25;
      p.morale=clamp(p.morale+d,0,100);
      const wasUnhappy=p.unhappy;
      p.unhappy=p.morale<30&&S.round>5;
      if(p.unhappy&&!wasUnhappy&&p.club===S.myClub)
        S.log.push(`${p.name} is ontevreden en wil weg`);
    });
  });
}
function objectiveOf(cid){
  const c=S.clubs[cid], o=OBJECTIVES[c.culture]||OBJECTIVES.middenmoot;
  if(c.league<0) return {txt:"Europees meedoen",pos:8};
  const n=clubsIn(c.league).length;
  return {txt:o.txt,pos:Math.max(1,Math.round(o.pos*n/18))};
}
function boardTick(){
  const tabs=S.leagues.map((L,li)=>table(li));
  S.clubs.forEach(c=>{
    if(c.league<0){c.board=clamp(c.board+(55-c.board)*.03,0,100);return;}
    const pos=tabs[c.league].findIndex(x=>x.id===c.id)+1, target=objectiveOf(c.id).pos;
    let d=clamp((target-pos)*.18,-.85,.9)+(55-c.board)*.02;
    if(c.balance<-6000) d-=.5;
    c.board=clamp(c.board+d,0,100);
  });
  if(S.clubs[S.myClub].board<10&&S.round>12&&!S.fired){
    S.fired=true;
    S.log.push("Het bestuur heeft het vertrouwen in je opgezegd.");
  }
}

/* ---------------- transfers ---------------- */
function askPrice(p){
  if(p.club<0) return 0;
  let m=1.15+.14*yearsLeft(p);
  if(p.age<=22)m*=1.35; else if(p.age>=31)m*=.65;
  if(p.unhappy)m*=.72;
  m*=1+.10*p.form;
  return Math.max(30,Math.round(p.value*m));
}
const wageDemand=p=>Math.round(Math.max(p.wage*1.2,Math.pow(Math.max(p.ovr-52,1),2.1)*95)*(p.unhappy?.95:1));
const windowOpen=()=>S.preseason?true:inWindow(datumVan(S.round,0));
function needs(cid){
  const sq=squad(cid), need={};
  ["GK","VD","MID","AV"].forEach(g=>{
    const want={GK:3,VD:8,MID:8,AV:6}[g];
    const have=sq.filter(p=>p.pos===g).length;
    const best=sq.filter(p=>p.pos===g).sort((a,b)=>b.ovr-a.ovr);
    const depth=mean(best.slice(0,{GK:2,VD:5,MID:4,AV:3}[g]).map(p=>p.ovr))||40;
    need[g]=(want-have)*2.2+(S.clubs[cid].prestige-depth)*1.4;
  });
  return need;
}
function playerAccepts(p,cid){
  if(p.club<0) return true;
  const mine=S.clubs[cid], his=S.clubs[p.club];
  if(p.unhappy) return true;
  if(mine.prestige>=his.prestige-1.5) return true;
  return Math.random()<.35-(his.prestige-mine.prestige)*.05;
}
function buy(pid,cid){
  const p=byId(pid), club=S.clubs[cid];
  const clause=p.clause&&p.club>=0&&p.clause<=transferBudget(cid);
  const fee=p.club<0?0:(clause?p.clause:askPrice(p)), wage=wageDemand(p);
  if(!windowOpen()) return "De transfermarkt is gesloten.";
  if(squadSize(cid)>=34) return "Je selectie zit vol (34 spelers).";
  if(fee>transferBudget(cid)) return "Niet genoeg transferbudget.";
  if(club.balance-fee < -expectedIncome(club)*.5) return "De club kan dit niet financieren.";
  if(wageBill(cid)+wage>club.wageBudget) return "Dat past niet in je salarisbudget.";
  if(p.club>=0&&squadSize(p.club)<=16&&!clause) return `${S.clubs[p.club].name} wil hem niet kwijt, hun selectie is te dun.`;
  if(!clause&&!playerAccepts(p,cid)) return `${p.name} ziet een overstap naar ${club.name} niet zitten.`;
  if(p.club>=0){S.clubs[p.club].balance+=fee;}
  club.balance-=fee;
  p.club=cid;p.wage=wage;p.contract=S.season+ri(3,4);p.cond=Math.max(p.cond,85);
  p.morale=clamp(p.morale+18,0,100);p.unhappy=false;
  p.clause=Math.random()<.3?Math.round(p.value*rf(1.8,2.8)):0;
  S.log.push(`${p.name} getekend${clause?" via zijn afkoopclausule":""} (${fee?fmtK(fee):"transfervrij"})`);
  save(); return null;
}
function bestBid(p){
  let best=null;
  S.clubs.forEach(c=>{
    if(c.id===p.club||squadSize(c.id)>=32) return;
    const nd=needs(c.id)[p.pos];
    const fee=Math.round(askPrice(p)*(.85+Math.random()*.3));
    if(nd>-1&&p.ovr>=c.prestige-6&&transferBudget(c.id)>=fee&&(!best||fee>best.fee)) best={club:c.id,fee};
  });
  return best;
}
function listPlayer(pid,vraagprijs){
  const p=byId(pid);
  if(p.club!==S.myClub) return "Dit is niet jouw speler.";
  p.telijst=Math.max(30,Math.round(vraagprijs||askPrice(p)));

    `${p.name} staat te koop voor ${fmtK(p.telijst)}. Geïnteresseerde clubs melden zich vanzelf in je inbox.`);

}
function unlist(pid){const p=byId(pid);p.telijst=null;save();return null;}
function deadlineNodig(){
  return !S.dl && !S.preseason && windowOpen() && windowSluitNa(S.round) && (S.dlGedaan||[]).indexOf(S.round)<0;
}
function transferAanbiedingen(){
  if(!windowOpen()&&!S.dl) return;
  squad(S.myClub).filter(p=>p.telijst).forEach(p=>{
    if(Math.random()>.34) return;
    const kopers=S.clubs.filter(c=>c.id!==S.myClub&&squadSize(c.id)<30&&
      needs(c.id)[p.pos]>-4&&p.ovr>=c.prestige-6&&transferBudget(c.id)>=p.telijst*.6);
    if(!kopers.length) return;
    const k=kopers[ri(0,kopers.length-1)];
    const bod=Math.round(p.telijst*rf(.62,1.12));
    if(bod>transferBudget(k.id)) return;
    msg("transfer",`💶 Bod op ${p.name}`,
      `${k.name} biedt ${fmtK(bod)} voor ${p.name}. Jouw vraagprijs is ${fmtK(p.telijst)}, zijn marktwaarde ${fmtK(p.value)}.`,
      {acties:[{id:"acceptBid",label:"Accepteren"},
               {id:"counterBid",label:`Tegeneisen ${fmtK(Math.round(bod*1.28))}`},
               {id:"rejectBid",label:"Afwijzen"}],
       data:{pid:p.id,fee:bod,club:k.id}});
  });
}
function sell(pid){
  const p=byId(pid);
  if(!windowOpen()) return "De transfermarkt is gesloten.";
  if(squadSize(p.club)<=16) return "Je hebt te weinig spelers over (minimaal 16).";

  if(!bid) return "Geen enkele club heeft interesse.";
  S.clubs[p.club].balance+=bid.fee; S.clubs[bid.club].balance-=bid.fee;
  const to=S.clubs[bid.club].name;
  p.club=bid.club;p.contract=S.season+3;p.morale=clamp(p.morale+12,0,100);p.unhappy=false;
  S.log.push(`${p.name} verkocht aan ${to} voor ${fmtK(bid.fee)}`);
  save(); return {ok:`${p.name} verkocht aan ${to} voor ${fmtK(bid.fee)}.`};
}
function renew(pid){
  const p=byId(pid), c=S.clubs[p.club], w=wageDemand(p);
  if(p.unhappy) return `${p.name} weigert bij te tekenen zolang hij ontevreden is.`;

function loanOut(pid){

  if(!windowOpen()&&!S.dl) return "De transfermarkt is gesloten.";
  if(p.club!==S.myClub) return "Dit is niet jouw speler.";

    p.ovr>=c.prestige-6);
  if(!kand.length) return "Geen enkele club wil hem huren.";

  p.loanFrom=S.myClub; p.loanUntil=S.season+1; p.club=to.id; p.role="Belangrijk";

  msg("transfer","🤝 "+p.name+" verhuurd",`${p.name} speelt dit seizoen bij ${to.name}. Hij komt aan het einde van het seizoen terug.`);
  save(); return null;
}
function loanIn(pid){
  const p=byId(pid), me=S.clubs[S.myClub];
  if(!windowOpen()&&!S.dl) return "De transfermarkt is gesloten.";
  if(p.club<0) return "Clubloze spelers huur je niet, die teken je gewoon.";
  if(p.loanFrom!=null) return "Hij wordt al verhuurd.";
  if(squadSize(S.myClub)>=32) return "Je selectie zit vol.";
  const van=S.clubs[p.club];
  const huur=Math.round(p.wage*.7);
  if(wageBill(S.myClub)+huur>me.wageBudget) return "Zijn salaris past niet in je begroting.";
  if(squadSize(p.club)<=18) return `${van.name} kan hem niet missen.`;
  if(p.role==="Cruciaal") return `${van.name} verhuurt geen basisspeler.`;
  if(me.reputation<van.reputation-14) return `${van.name} ziet jouw club niet als goede leerschool.`;
  if(!playerAccepts(p,S.myClub)) return `${p.name} ziet de huurperiode niet zitten.`;
  p.loanFrom=van.id; p.loanUntil=S.season+1; p.club=S.myClub; p.wage=huur; p.role="Belangrijk";
  S.log.push(`${p.name} gehuurd van ${van.name}`);
  save(); return null;
}
function endLoans(){
  S.players.forEach(p=>{
    if(p.loanFrom==null) return;
    const terug=S.clubs[p.loanFrom];
    if(!terug){p.loanFrom=null;return;}
    if(p.club===S.myClub||p.loanFrom===S.myClub)
      msg("transfer","🤝 Huurperiode voorbij",`${p.name} keert terug naar ${terug.name}.`);
    p.club=p.loanFrom; p.loanFrom=null; p.loanUntil=null;
  });
}

function release(pid){

/* AI koopt op basis van gaten in de selectie */
function aiWindow(n){
  for(let i=0;i<n;i++){
    const pick=S.clubs.filter(c=>c.id!==S.myClub);
    const buyer=pick[ri(0,pick.length-1)];
    if(squadSize(buyer.id)>=30) continue;
    const nd=needs(buyer.id);
    const gap=Object.keys(nd).sort((a,b)=>nd[b]-nd[a])[0];
    if(nd[gap]<-1) continue;
    const bud=transferBudget(buyer.id);
    const targets=S.players.filter(p=>p.club!==buyer.id&&p.club!==S.myClub&&p.pos===gap&&
      p.ovr>buyer.prestige-3&&askPrice(p)<=bud&&
      wageBill(buyer.id)+wageDemand(p)<=buyer.wageBudget&&
      (p.club<0||squadSize(p.club)>17||p.unhappy)&&
      (p.club<0||buyer.reputation>=S.clubs[p.club].reputation-9)&&
      playerAccepts(p,buyer.id));
    if(!targets.length) continue;
    targets.sort((a,b)=>(b.ovr+(b.unhappy?3:0))-(a.ovr+(a.unhappy?3:0)));
    const t=targets[ri(0,Math.min(4,targets.length-1))], fee=askPrice(t);
    const from=t.club<0?"transfervrij":S.clubs[t.club].name;
    if(t.club>=0)S.clubs[t.club].balance+=fee;
    buyer.balance-=fee;t.club=buyer.id;t.wage=wageDemand(t);t.contract=S.season+ri(3,4);
    t.morale=clamp(t.morale+15,0,100);t.unhappy=false;
    S.log.push(`${t.name} (${from}) → ${buyer.name} · ${fmtK(fee)}`);
  }
}

/* ---------------- stand ---------------- */
function table(li){
  if(li==null) li=S.clubs[S.myClub].league;
  const t={};
  S.clubs.filter(c=>c.league===li).forEach(c=>t[c.id]={id:c.id,name:c.name,color:c.color,g:0,w:0,d:0,l:0,gf:0,ga:0,p:0,form:[]});
  S.leagues[li].results.forEach(r=>r.forEach(m=>{
    if(!t[m.h]||!t[m.a]) return;
    const H=t[m.h],A=t[m.a];
    H.g++;A.g++;H.gf+=m.hg;H.ga+=m.ag;A.gf+=m.ag;A.ga+=m.hg;
    if(m.hg>m.ag){H.w++;A.l++;H.p+=3;H.form.push("W");A.form.push("L");}
    else if(m.hg<m.ag){A.w++;H.l++;A.p+=3;A.form.push("W");H.form.push("L");}
    else{H.d++;A.d++;H.p++;A.p++;H.form.push("D");A.form.push("D");}
  }));
  return Object.values(t).sort((a,b)=>b.p-a.p||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.name.localeCompare(b.name));
}

/* ---------------- ontwikkeling ---------------- */
function developPlayer(p){
  const games=Math.max(0,p.rN), share=clamp(games/34,0,1);
  const r=avgRating(p);
  // prestatie-index: hoe goed deed hij het t.o.v. wat je van dit niveau verwacht
  const perf = games>=5 ? (r-6.65) : (share<.15 ? -.35 : 0);
  const gap=p.pot-p.ovr;
  let d;
  if(p.age<=21)      d = gap*(.22+.20*share) + perf*2.6 + rf(-.7,.9);
  else if(p.age<=24) d = gap*(.17+.16*share) + perf*2.3 + rf(-.7,.8);
  else if(p.age<=28) d = gap*(.07+.10*share) + perf*1.7 + rf(-.8,.8);
  else if(p.age<=31) d = perf*1.2 - .9 + rf(-.8,.6);
  else               d = perf*.8 - 2.1 - (p.age-31)*.45 + rf(-.9,.5);
  d=clamp(Math.round(d),-6,5);
  // potentie beweegt mee: uitblinken tilt je plafond, wegkwijnen verlaagt het
  let pd=0;
  if(p.age<=23) pd = Math.round(clamp(perf*3.0 + (share>.5?.6:-.9) + rf(-.5,.5),-4,4));
  else if(p.age<=27) pd = Math.round(clamp(perf*1.8 - .3 + rf(-.5,.5),-3,3));
  else pd = Math.round(clamp(perf*.8 - 1.2,-4,1));
  p.pot=clamp(p.pot+pd,p.ovr+d,95);
  p.ovr=clamp(Math.min(p.ovr+d,p.pot),42,95);
  // attributen: fysiek zakt na je 30e sneller dan mentaal
  const phys=p.pos==="GK"?[0]:PHYS, tech=p.pos==="GK"?[3]:TECH;
  const focus=p.train&&TRAIN_IDX[p.train]?TRAIN_IDX[p.train]:null;
  p.a=p.a.map((v,i)=>{
    let ad=d*rf(.6,1.2);
    if(focus) ad*= focus.indexOf(i)>=0 ? 1.6 : .8;
    if(focus&&focus.indexOf(i)>=0&&d<=0) ad+=rf(.3,1.1);
    if(p.age>=30){
      if(phys.includes(i)) ad-=Math.min(2.4,rf(.8,1.8)+(p.age-30)*.22);
      else if(tech.includes(i)) ad-=rf(.1,.7);
      else ad+=rf(-.2,.5);            // mentaal en positiespel blijven langer op peil
    }
    return clamp(Math.round(v+ad),25,99);
  });
  p.value=Math.round(clamp(Math.pow(Math.max(p.ovr-50,1),2.6)*(p.age<=23?4.6:p.age<=29?3:p.age<=32?1.4:.6)
    *(1+.35*clamp((p.pot-p.ovr)/12,0,1)),25,180000));
  p.clause=Math.random()<.25?Math.round(p.value*rf(1.7,2.7)):0;
}
function regen(nat,potLevel,cid){
  const nid=S.players.reduce((m,p)=>Math.max(m,p.id),0)+1;
  const pos=["GK","CB","CB","LB","RB","CDM","CM","CM","CAM","LM","RM","LW","RW","ST","ST"][ri(0,14)];
  const base=clamp(Math.round(potLevel-ri(14,24)),44,70);
  const p={id:nid,name:VN[ri(0,VN.length-1)]+" "+AN[ri(0,AN.length-1)],club:cid,poss:[pos],pos:GROUP[pos],
    age:ri(16,18),ovr:base,pot:clamp(Math.round(potLevel+ri(-6,4)),base+4,94),
    a:[0,1,2,3,4,5].map(()=>clamp(base+ri(-6,6)+(GROUP[pos]==="GK"?5:0),30,88)),
    value:Math.round(Math.pow(Math.max(base-50,1),2.6)*5),wage:base*130,contract:S.season+ri(2,4),
    nat:nat||"Netherlands",goals:0,apps:0,rSum:0,rN:0,form:0,morale:72,cond:100,inj:0,ban:0,unhappy:false,clause:0,st:leegSt(),
    role:"Sporadisch",captain:false,jaren:0,scouted:cid===S.myClub?100:ri(5,35),train:null,retrain:null,retrainP:0,
    persona:PERSONA[ri(0,PERSONA.length-1)],leider:ri(5,45)};
  S.players.push(p); return p;
}
function enforceWages(){
  S.clubs.forEach(c=>{
    let g=0;
    while(wageBill(c.id)>c.wageBudget&&squadSize(c.id)>18&&g++<30){
      const out=squad(c.id).sort((a,b)=>(b.wage/Math.max(b.ovr-45,1))-(a.wage/Math.max(a.ovr-45,1)))[0];

      out.club=-1; out.contract=S.season;

  });
}
function promotieDegradatie(){
  /* alleen waar een tweede niveau bestaat: Engeland */
  const paren=[["Premier League","Championship"]];
  paren.forEach(([boven,onder])=>{
    const bi=S.leagues.findIndex(L=>L.name===boven), oi=S.leagues.findIndex(L=>L.name===onder);
    if(bi<0||oi<0) return;
    const tb=table(bi), to=table(oi);
    const zakkers=tb.slice(-3).map(r=>r.id), stijgers=to.slice(0,3).map(r=>r.id);
    zakkers.forEach(id=>{S.clubs[id].league=oi;S.clubs[id].prestige=clamp(S.clubs[id].prestige-1.2,56,90);});
    stijgers.forEach(id=>{S.clubs[id].league=bi;S.clubs[id].prestige=clamp(S.clubs[id].prestige+1.2,56,90);});
    const namen=n=>n.map(id=>S.clubs[id].name).join(", ");

      `Uit de ${boven} degraderen ${namen(zakkers)}. Vanuit de ${onder} promoveren ${namen(stijgers)}.`);
    if(zakkers.indexOf(S.myClub)>=0){
      S.clubs[S.myClub].board=clamp(S.clubs[S.myClub].board-25,0,100);
      msg("bestuur","⬇️ Gedegradeerd",`${S.clubs[S.myClub].name} speelt volgend seizoen in de ${onder}. Het bestuur verwacht directe terugkeer.`);
    }
    if(stijgers.indexOf(S.myClub)>=0){
      S.clubs[S.myClub].board=clamp(S.clubs[S.myClub].board+22,0,100);
      msg("bestuur","⬆️ Gepromoveerd",`${S.clubs[S.myClub].name} promoveert naar de ${boven}.`);
    }
  });
}
function endSeason(){
  seasonAwards();
  noteerSeizoen();
  const myLi=S.clubs[S.myClub].league;
  const t=table(myLi);
  const myPos=t.findIndex(x=>x.id===S.myClub)+1;

    cl:S.euro&&S.euro.CL&&S.euro.CL.winner!=null?S.clubs[S.euro.CL.winner].name:"—",
    doel:myPos<=obj.pos?"gehaald":"gemist"});
  S.leagues.forEach((L,li)=>{
    const tl=table(li), n=tl.length;
    tl.forEach((r,i)=>{const c=S.clubs[r.id];
      const prijs=Math.round((n-i)*260*(1+L.tv*2.2));
      c.balance+=prijs; c.income+=prijs;
      c.board=clamp(c.board+(objectiveOf(c.id).pos-(i+1))*1.4,0,100);
      c.prestige=clamp(c.prestige+(((n/2+.5)-(i+1))*.05),56,90);
    });
  });
  updateCoef();

  S.clubs.forEach(c=>{
    if(c.balance<-3000){

      if(c.id===S.myClub) S.log.push(`De eigenaar dekte een tekort van ${fmtK(inj)}. Het bestuur is niet blij.`);
    }
  });
  if(S.clubs[S.myClub].board<20) {S.fired=true;S.log.push("Je bent ontslagen na een teleurstellend seizoen.");}
  // contracten
  S.players.forEach(p=>{
    if(p.club>=0&&p.club!==S.myClub&&p.contract<=S.season+1){
      const c=S.clubs[p.club];
      const keep=avgRating(p)>6.5||p.age<=23||p.ovr>=c.prestige;
      if(keep&&Math.random()<.88) p.contract=S.season+ri(2,4);
    }
  });
  const leaving=S.players.filter(p=>p.club>=0&&p.contract<=S.season+1);
  leaving.forEach(p=>{if(p.club===S.myClub)S.log.push(`${p.name} vertrekt transfervrij`);p.club=-1;});
  // ontwikkeling + veroudering
  S.players.forEach(p=>{p.age++;p.jaren=(p.jaren||0)+1;applyTraining(p);developPlayer(p);p.goals=0;p.apps=0;p.rSum=0;p.rN=0;p.cond=100;p.inj=0;p.ban=0;p.form=0;p._vroeg=false;p._contractVraag=false;});
  // stoppers -> regens met dezelfde nationaliteit en vergelijkbaar plafond
  const retiring=S.players.filter(p=>p.age>=35&&(p.ovr<70||p.age>=38||Math.random()<.45));
  retiring.forEach(p=>{
    const host=p.club>=0?p.club:ri(0,17);
    regen(p.nat,clamp(p.pot-ri(0,8),58,90),host);
  });
  S.players=S.players.filter(p=>retiring.indexOf(p)<0);
  S.players=S.players.filter(p=>!(p.club<0&&(p.age>=34||p.ovr<60)));
  const vrij=S.players.filter(p=>p.club<0).sort((a,b)=>b.ovr-a.ovr);
  if(vrij.length>700){const weg=new Set(vrij.slice(700).map(p=>p.id));S.players=S.players.filter(p=>!weg.has(p.id));}
  // jeugd uit de opleiding
  S.clubs.forEach(c=>{
    const n=c.culture==="jeugd"?4:3;
    for(let i=0;i<n;i++) regen("Netherlands",clamp(Math.round(c.prestige+ri(-6,10)),58,88),c.id);
  });
  S.players.forEach(p=>{p.st=leegSt();});
  S.season++;S.round=0;S.log=[];S.reports=[];S.finance=[];clearSetup();S.preseason=3;S.friendlies=[];S.dlGedaan=[];
  S.leagues.forEach((L,li)=>{L.results=[];
    L.fixtures=buildFixtures(clubsIn(li));});
  buildCups();
  newEuroSeason(); resetNations();
  S.clubs.forEach(c=>{c.income=0;c.costs=0;});
  setBudgets();
  // AI vult selecties aan
  S.clubs.forEach(c=>{
    let g=0;
    while(squadSize(c.id)<25&&g++<60){
      const nood=squadSize(c.id)<18;
      const fas=S.players.filter(p=>p.club<0&&(nood||wageBill(c.id)+wageDemand(p)<=c.wageBudget)).sort((a,b)=>b.ovr-a.ovr);
      if(!fas.length)break;
      const t2=fas[ri(0,Math.min(10,fas.length-1))];
      t2.club=c.id;t2.wage=wageDemand(t2);t2.contract=S.season+ri(2,4);
    }
  });
  endLoans();
  aiWindow(14);
  aiLoans();
  enforceWages();
  managerCarousel();
  assignRoles();
  S.clubs.forEach(c=>setCaptain(c.id));
  S.inbox=S.inbox.slice(0,10);
  euroDrawMessage();
  const cupNaam=myCup()?myCup().naam:"de beker";
  msg("bestuur","🎯 Doel voor "+S.season+"/"+String(S.season+1).slice(2),
    `Het bestuur verwacht: ${objectiveOf(S.myClub).txt.toLowerCase()}. Je speelt in de ${S.leagues[S.clubs[S.myClub].league].name} en in de ${cupNaam}.`);
  S.lineup=autoXI(S.myClub,S.tactics.formation);
  save();
}

/* ---------------- opslag ---------------- */
const kw=w=>"€"+(w/1000).toFixed(1).replace(".",",")+"k";
const fmtK=k=>k>=1000?"€"+(k/1000).toFixed(k>=10000?0:1).replace(".",",")+" mln":"€"+Math.round(k)+"k";
/* ---- compacte opslag: spelers en clubs als arrays, lege statistieken weggelaten ---- */
const P_KEYS=["id","name","club","poss","pos","age","ovr","pot","a","value","wage","contract","nat",
 "goals","apps","rSum","rN","form","morale","cond","inj","ban","unhappy","role","captain","jaren",
 "scouted","train","retrain","retrainP","persona","leider","clause","telijst","loanFrom","loanUntil"];
const ST_KEYS=["g","a","ap","min","sh","yc","rc","cs","rs","rn"];
const C_KEYS=["id","league","balance","board","tactic","income","costs","reputation","director","manager",
 "euro","wageBudget","wageBasis","shift","prestige","transferIn","transferUit","cap","ticket","culture","color","name","land","rivals"];
function packSt(st){
  if(!st) return 0;
  const uit={};
  ["lg","cup","eu","nt"].forEach(k=>{
    const b=st[k]; if(!b) return;
    if(b.ap||b.g||b.a||b.min) uit[k]=ST_KEYS.map(x=>Math.round((b[x]||0)*100)/100);
  });
  return Object.keys(uit).length?uit:0;
}
function unpackSt(u){
  const st=leegSt();
  if(!u) return st;
  Object.keys(u).forEach(k=>{ST_KEYS.forEach((x,i)=>st[k][x]=u[k][i]||0);});
  return st;
}
function slankM(m){
  return {h:m.h,a:m.a,hg:m.hg,ag:m.ag,pens:m.pens||null,
    sc:(m.sc||[]).map(s=>({t:s.t,n:s.n,min:s.min})),timeline:[],events:[]};
}
function pack(){
  const kern={};
  Object.keys(S).forEach(k=>{ if(k!=="players"&&k!=="clubs") kern[k]=S[k]; });
  /* wedstrijdverslagen van oude duels hoeven niet mee de opslag in */
  kern.leagues=S.leagues.map(L=>({...L,results:L.results.map((r,i)=>
    r.map(m=>i>=L.results.length-4?slankM(m):{h:m.h,a:m.a,hg:m.hg,ag:m.ag,sc:[],timeline:[],events:[]}))}));
  kern.cups=(S.cups||[]).map(c=>({...c,done:c.done.map((d,i)=>({...d,matches:d.matches.map(m=>
    i>=c.done.length-2?slankM(m):{h:m.h,a:m.a,hg:m.hg,ag:m.ag,pens:m.pens||null,sc:[],timeline:[],events:[]})}))}));
  if(S.euro){
    kern.euro={};
    Object.keys(S.euro).forEach(k=>{const E=S.euro[k];
      kern.euro[k]={...E,done:E.done.map((d,i)=>({...d,matches:d.matches.map(m=>
      i>=E.done.length-2?slankM(m):{h:m.h,a:m.a,hg:m.hg,ag:m.ag,pens:m.pens||null,sc:[],timeline:[],events:[]})}))};});
  }
  kern.friendlies=[];
  kern.ntResults=(S.ntResults||[]).slice(-2);
  kern.P=S.players.map(p=>P_KEYS.map(k=>p[k]).concat([packSt(p.st)]));
  kern.C=S.clubs.map(c=>C_KEYS.map(k=>c[k]));
  kern.packed=1;
  return JSON.stringify(kern);
}
function unpack(raw){
  const d=typeof raw==="string"?JSON.parse(raw):raw;
  if(!d.packed) return d;
  d.players=d.P.map(a=>{
    const p={};
    P_KEYS.forEach((k,i)=>p[k]=a[i]);
    p.st=unpackSt(a[P_KEYS.length]);
    return p;
  });
  d.clubs=d.C.map(a=>{const c={};C_KEYS.forEach((k,i)=>c[k]=a[i]);return c;});
  delete d.P; delete d.C; delete d.packed;
  return d;
}
function save(){try{
  localStorage.setItem(SAVE_KEY,pack());
  localStorage.setItem(SAVE_KEY+"_kort",JSON.stringify({club:S.clubs[S.myClub].name,season:S.season,round:S.round}));
}catch(e){}}
function slotKey(i){return SAVE_KEY+"_slot"+i;}
function saveSlots(){
  const uit=[];
  for(let i=1;i<=3;i++){
    try{
      const meta=localStorage.getItem(slotKey(i)+"_meta");
      if(meta&&localStorage.getItem(slotKey(i))) uit.push(JSON.parse(meta));
      else uit.push(null);
    }catch(e){uit.push(null);}
  }
  return uit;
}
/* saves worden gzip-verpakt zodat er meerdere in de browseropslag passen */
async function gzip(str){
  if(typeof CompressionStream==="undefined") return null;
  const cs=new CompressionStream("gzip");
  const stream=new Blob([str]).stream().pipeThrough(cs);
  const buf=await new Response(stream).arrayBuffer();
  let bin="", bytes=new Uint8Array(buf);
  for(let i=0;i<bytes.length;i+=8192) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return "GZ:"+btoa(bin);
}
async function gunzip(s){
  const bin=atob(s.slice(3)), bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  const ds=new DecompressionStream("gzip");
  const stream=new Blob([bytes]).stream().pipeThrough(ds);
  return await new Response(stream).text();
}
async function saveToSlot(i){
  try{
    S.opgeslagen=new Date().toLocaleString("nl-NL");
    const rauw=pack();
    const data=(await gzip(rauw))||rauw;
    localStorage.setItem(slotKey(i),data);
    localStorage.setItem(slotKey(i)+"_meta",JSON.stringify({club:S.clubs[S.myClub].name,season:S.season,
      round:S.round,v:S.v,datum:S.opgeslagen}));
    return null;
  }catch(e){return "Opslaan mislukt — het geheugen van je browser zit vol. Wis een ander slot.";}
}
async function loadSlot(i){
  try{
    let raw=localStorage.getItem(slotKey(i));
    if(!raw) return "Dit slot is leeg.";
    if(raw.slice(0,3)==="GZ:") raw=await gunzip(raw);
    const d=unpack(raw);
    if(d.v!==SAVE_VERSION) return "Deze save komt uit versie "+d.v+", het spel draait op "+SAVE_VERSION+".";
    S=d; save(); return null;
  }catch(e){return "Kon deze save niet lezen.";}
}
function deleteSlot(i){try{localStorage.removeItem(slotKey(i));localStorage.removeItem(slotKey(i)+"_meta");}catch(e){}}
function load(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;const d=unpack(raw);if(!d||d.v!==SAVE_VERSION)return false;S=d;return true;}catch(e){return false;}}
